name: Nexus checks
on:
  push:
    paths: ['app/**','tests_nexus/**','web/**','requirements-nexus.txt','migrations/**','.github/workflows/nexus.yml']
  pull_request:
    paths: ['app/**','tests_nexus/**','web/**','requirements-nexus.txt','migrations/**','.github/workflows/nexus.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: nexus_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexus_ci -d nexus_ci" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus_ci:ci-only-dummy-password@127.0.0.1:5432/nexus_ci
      NEXUS_REDIS_URL: redis://127.0.0.1:6379/0
      NEXUS_SIGNING_KEY: nexus-ci-only-not-for-production-0123456789abcdef
      NEXUS_TEACHER_PASSWORD: Teacher123!
      NEXUS_STUDENT_PASSWORD: Student123!
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-nexus.txt}
      - run: pip install -r requirements-nexus.txt pytest
      - run: python -m pytest tests_nexus -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
        with: {version: '11'}
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
