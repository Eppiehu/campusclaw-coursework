<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · CampusClaw</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-body"><main class="login-layout"><section class="login-hero"><div class="brand"><span class="brand-mark">CC</span> CampusClaw</div><div><div class="eyebrow">CLASSROOM MATERIALS</div><h1>让每一份资料，<br><em>准确抵达你的班级。</em></h1><p>教师上传课堂材料，学生登录后只查看自己班级的内容。</p></div><small>CampusClaw · 第二课演示系统</small></section>
<section class="login-main"><form class="login-card" id="login-form" method="post" action="{{ url_for('auth.login') }}"><div class="eyebrow">WELCOME BACK</div><h2>登录系统</h2><p class="muted">使用课程演示账号登录。</p><label for="username">用户名</label><input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required placeholder="请输入用户名"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"><p class="error" id="login-error" role="alert">{{ error or '' }}</p><button class="primary full" type="submit">登录 CampusClaw →</button><div class="demo"><strong>演示账号</strong><br>教师：teacher_a / Teacher123!<br>A 班学生：student_a1 / Student123!<br>B 班学生：student_b1 / Student123!</div></form></section></main><script src="{{ url_for('static', filename='login.js') }}" defer></script></body></html>
